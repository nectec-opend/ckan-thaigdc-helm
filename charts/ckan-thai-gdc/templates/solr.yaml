{{- if .Values.solr.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ckan.solrName" . }}
  labels:
    {{- include "ckan.labels" . | nindent 4 }}
    app.kubernetes.io/component: solr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ckan.selector" (dict "root" . "component" "solr") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ckan.selector" (dict "root" . "component" "solr") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 8983
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: solr
          image: "{{ .Values.solr.image.repository }}:{{ .Values.solr.image.tag }}"
          imagePullPolicy: {{ .Values.solr.image.pullPolicy }}
          env:
            - name: SOLR_JAVA_MEM
              value: {{ .Values.solr.javaMem | quote }}
            - name: TZ
              value: "Asia/Bangkok"
          ports:
            - name: solr
              containerPort: 8983
          readinessProbe:
            httpGet:
              path: /solr/ckan/admin/ping
              port: 8983
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.solr.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/solr
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ckan.solrName" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ckan.solrName" . }}
  labels:
    {{- include "ckan.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ckan.selector" (dict "root" . "component" "solr") | nindent 4 }}
  ports:
    - name: solr
      port: 8983
      targetPort: 8983
{{- end }}
